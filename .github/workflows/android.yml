name: Android build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'echo "::error title=release::Falhou no comando: $BASH_COMMAND"' ERR
          set -eo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Segredo ANDROID_KEYSTORE_BASE64 ausente"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Segredo ANDROID_KEYSTORE_PASSWORD ausente"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Segredo ANDROID_KEY_ALIAS ausente"; exit 1; }
          # Tolerante a espaços, quebras de linha e BOM do Windows; diagnostica sem mostrar o conteúdo.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/keystore.b64"
          len=$(wc -c < "$RUNNER_TEMP/keystore.b64")
          raw=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | wc -c)
          echo "Segredo ANDROID_KEYSTORE_BASE64: $raw caracteres; $len válidos em base64; resto da divisão por 4: $((len % 4))"
          if [ $((len % 4)) -ne 0 ] || [ "$len" -lt 1000 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 parece incompleto ($len caracteres base64; esperado múltiplo de 4 e alguns milhares). Copie o arquivo .b64 inteiro de novo."
            exit 1
          fi
          base64 -d "$RUNNER_TEMP/keystore.b64" > "$RUNNER_TEMP/release.jks"
          rm -f "$RUNNER_TEMP/keystore.b64"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          version=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PT2VHF_APRS_Client_Android_v${version}.apk"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null \
            || { echo "::error::Keystore, senha ou alias não conferem (verifique os segredos ANDROID_*)"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "dist/PT2VHF_APRS_Client_Android_v${version}.apk" | head -3
          echo "VERSION=$version" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release (origem dos arquivos do site)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "PT2VHF APRS Client for Android $tag" \
              --notes "Downloads oficiais em https://www.pt2vhf.com/android"
          fi
